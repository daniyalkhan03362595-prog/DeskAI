[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deskai"
version = "0.1.0"
description = "Lean desktop presentation shell and AI studio supervisor"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Daniyal Khan" }
]
dependencies = [
    "pywebview>=5.0.0",
    "fastapi>=0.115.0",
    "starlette>=0.40.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "psutil>=6.0.0",
]

[project.optional-dependencies]
linux = [
    "PyGObject>=3.46.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "playwright>=1.40.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "pip-audit>=2.7.0",
    "black>=24.1.0",
    "flake8>=7.0.0",
]

[project.scripts]
deskai = "deskai.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deskai = ["static/**/*"]

[tool.black]
line-length = 120
target-version = ["py311"]
