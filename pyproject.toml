[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deskai"
version = "0.1.0"
description = "Lean, offline-first autonomous desktop AI engineering studio"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Daniyal Khan" }
]
dependencies = [
    "pywebview>=4.4.1",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "httpx>=0.26.0",
    "sqlite-vec>=0.1.3",
    "pynvml>=11.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.1.0",
    "flake8>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
