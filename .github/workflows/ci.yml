name: DeskAI Layer 1 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Package & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pip-audit flake8 playwright httpx2
          playwright install --with-deps chromium

      - name: Run Vulnerability Audit
        run: |
          pip-audit

      - name: Run Code Style Check (flake8)
        run: |
          flake8 src/deskai/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Layer 1 Integration, Browser Smoke & Security Tests
        run: |
          python -m unittest discover -s tests
