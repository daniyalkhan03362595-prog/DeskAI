name: DeskAI Layer 1 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Code Formatting Check (black)
        run: black --check src tests

      - name: Code Quality & Style Check (flake8)
        run: flake8

      - name: WCAG 2.1 Contrast Check
        run: python tools/check_contrast.py

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev gir1.2-webkit2-4.1 || sudo apt-get install -y libgirepository1.0-dev libcairo2-dev gir1.2-webkit2-4.0

      - name: Install Package & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Install Playwright Browsers
        run: playwright install --with-deps chromium

      - name: Run Test Suite
        run: python -m unittest discover -s tests

  e2e-smoke:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev gir1.2-webkit2-4.1 || sudo apt-get install -y libgirepository1.0-dev libcairo2-dev gir1.2-webkit2-4.0

      - name: Install Package & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Install Playwright Browsers
        run: playwright install --with-deps chromium

      - name: Run Playwright DesktopServer E2E Smoke Test
        run: python -m unittest tests/test_server_e2e_smoke.py
